# patchman-openscap configuration
# See patchman-openscap --help for details

[compliance]
# XCCDF profile to evaluate (leave blank for OS-specific default)
# Use 'patchman-openscap --list-profiles' to see available profiles
#profile =

# Directory containing SCAP datastream files
#content_dir = /usr/share/xml/scap/ssg/content

# Directory for scan results (XML and JSON)
#results_dir = /var/lib/patchman/compliance
