name: Create release and upload assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "Previous tag: $PREV_TAG"
          
          # Generate changelog from commits
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"  * %s" $PREV_TAG..${{ github.ref_name }} --no-merges | head -50)
          else
            CHANGES="  * Initial release"
          fi
          
          # Create release body
          {
            echo "## Changes in ${{ github.ref_name }}"
            echo ""
            echo "$CHANGES"
          } > release_body.md
          
          # Output for other jobs (escape newlines)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-go-binaries:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X github.com/furlongm/patchman-client/go/lib/report.Version=${{ env.VERSION }}" \
            -o ../patchman-client-go-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd
      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: patchman-client-go-${{ matrix.goos }}-${{ matrix.goarch }}
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb-packages:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt update
          export DEBIAN_FRONTEND=noninteractive
          apt -y install debhelper dh-golang dh-python python3 golang-go git devscripts
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Generate debian changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          
          # Generate changelog entry
          cat > debian/changelog << EOF
          patchman-client (${{ env.VERSION }}-1) stable; urgency=medium

          EOF
          
          # Add commit messages
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"  * %s" $PREV_TAG..${{ github.ref_name }} --no-merges | head -20 >> debian/changelog
          else
            echo "  * Initial release" >> debian/changelog
          fi
          
          # Add footer
          cat >> debian/changelog << EOF

           -- Marcus Furlong <furlongm@gmail.com>  $(date -R)
          EOF
          
          cat debian/changelog
      - name: Build deb packages
        run: |
          dpkg-buildpackage -us -uc -b
      - name: Upload deb packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ../patchman-client_${{ env.VERSION }}-1_all.deb
            ../patchman-client-bash_${{ env.VERSION }}-1_all.deb
            ../patchman-client-python_${{ env.VERSION }}-1_all.deb
            ../patchman-client-go_${{ env.VERSION }}-1_*.deb
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm-packages:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install rpm-build golang python3-devel git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build rpm packages
        run: |
          mkdir -p $HOME/rpmbuild/{SOURCES,SPECS}
          tar czf $HOME/rpmbuild/SOURCES/patchman-client-${{ env.VERSION }}.tar.gz --transform "s,^,patchman-client-${{ env.VERSION }}/," .
          rpmbuild -bb --define "version ${{ env.VERSION }}" patchman-client.spec
      - name: Copy RPMs to workspace
        run: cp $HOME/rpmbuild/RPMS/*/*.rpm .
      - name: Upload rpm packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.rpm"
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

